[package]
name = "vbot"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6"
serenity = "0.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
rand = "0.10"
percent-encoding = "2"
envfile = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
